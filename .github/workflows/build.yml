name: build

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '11', '17', '21' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show Java version
        run: java -version

      - name: Build with Maven
        run: mvn -B -ntp clean verify

      - name: Verify MRJAR layout (only on Java 17+)
        if: matrix.java != '11'
        run: |
          jar tf core/target/generator-core.jar | grep -E "META-INF/versions/17" || (echo "MRJAR layout missing" && exit 1)
